[project]
name = "comfyui-enhancement-utils"
description = "Quality-of-life tools for ComfyUI, built on the V3 API with full subgraph and Nodes 2.0 support: a Flow Visualizer that shows how data flows through a workflow and replays the last run (what ran, was cached, skipped, failed, or changed since), a resource monitor (CPU/RAM/GPU/VRAM/temp/power with history graphs), per-node timing badges, node search with jump-to-node and Follow Execution, graph auto-arrange (Quick/dagre/ELK), and handy nodes: Profiler Timing, Load Image (With Subfolders), Parse JSON, Execution Gate, Play Sound and System Notification. A modern alternative to ComfyUI-Custom-Scripts and Crystools."
version = "1.11.0"
keywords = [
    "ComfyUI",
    "ComfyUI-Custom-Scripts",
    "Crystools",
    "subgraph",
    "Nodes 2.0",
    "flow visualizer",
    "data flow",
    "workflow visualization",
    "execution order",
    "last run",
    "replay",
    "changed since last run",
    "switch",
    "lazy inputs",
    "Set/Get nodes",
    "Use Everywhere",
    "resource monitor",
    "CPU monitor",
    "GPU monitor",
    "VRAM monitor",
    "temperature monitor",
    "power monitor",
    "electricity cost",
    "node profiler",
    "profiler timing",
    "execution time",
    "benchmark",
    "node search",
    "go to node",
    "find node",
    "node navigation",
    "follow execution",
    "graph arrange",
    "graph layout",
    "auto layout",
    "ELK",
    "dagre",
    "image loader",
    "load image from folder",
    "subfolders",
    "custom folder",
    "image metadata",
    "mask editor",
    "parse json",
    "json",
    "execution gate",
    "conditional execution",
    "execution blocker",
    "control bridge",
    "play sound",
    "system notification",
    "utilities",
    "enhancement",
]
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "psutil",
]

[project.urls]
Repository = "https://github.com/phazei/ComfyUI-Enhancement-Utils"
Documentation = "https://github.com/phazei/ComfyUI-Enhancement-Utils#readme"
"Bug Tracker" = "https://github.com/phazei/ComfyUI-Enhancement-Utils/issues"
Funding = "https://ko-fi.com/phazei"

