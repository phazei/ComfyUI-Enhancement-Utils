[project]
name = "comfyui-enhancement-utils"
description = "A curated set of ComfyUI enhancements built on the V3 API with full subgraph support: real-time resource monitor (CPU/RAM/GPU/VRAM/temp), node execution profiler with per-node timing badges, graph auto-layout (Quick/Dagre/ELK), node navigation with Follow Execution, Play Sound, System Notification, Execution Gate (lazy conditional pass-through), and an image loader with recursive subfolder scanning, custom-folder loading, and metadata extraction. A modern, well-organized alternative to ComfyUI-Custom-Scripts and Crystools."
version = "1.4.0"
keywords = [
    "ComfyUI",
    "ComfyUI-Custom-Scripts",
    "Crystools",
    "resource monitor",
    "CPU monitor",
    "GPU monitor",
    "VRAM monitor",
    "temperature monitor",
    "power monitor",
    "electricity cost",
    "node profiler",
    "profiler timing",
    "execution time",
    "benchmark",
    "graph arrange",
    "graph layout",
    "ELK",
    "dagre",
    "node navigation",
    "follow execution",
    "subgraph",
    "image loader",
    "custom folder",
    "folder loader",
    "load image from folder",
    "mask editor",
    "play sound",
    "system notification",
    "parse json",
    "json",
    "execution gate",
    "conditional execution",
    "execution blocker",
    "control bridge",
    "utilities",
    "enhancement",
]
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "psutil",
    "piexif",
]

[project.urls]
Repository = "https://github.com/phazei/ComfyUI-Enhancement-Utils"

[tool.comfy]
PublisherId = "phazei"
DisplayName = "Enhancement Utils"
Icon = ""
Web = "./js"
